name: Build macOS (Darwin)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-darwin:
    name: Build macOS (amd64 + arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Create dist directory
        run: mkdir -p dist

      - name: Build darwin/amd64 (Intel)
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=1 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/lychee-darwin-amd64 .

      - name: Build darwin/arm64 (Apple Silicon)
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=1 \
            go build -trimpath -ldflags="-s -w" \
            -o dist/lychee-darwin-arm64 .

      - name: Verify binaries
        run: |
          file dist/lychee-darwin-amd64
          file dist/lychee-darwin-arm64
          echo "---"
          echo "amd64 binary: $(du -h dist/lychee-darwin-amd64 | cut -f1)"
          echo "arm64 binary: $(du -h dist/lychee-darwin-arm64 | cut -f1)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lychee-darwin
          path: |
            dist/lychee-darwin-amd64
            dist/lychee-darwin-arm64
          retention-days: 7

      - name: Upload to release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lychee-darwin-amd64
            dist/lychee-darwin-arm64
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
