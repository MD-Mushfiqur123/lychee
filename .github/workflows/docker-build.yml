# =============================================================================
# Docker Multi-Architecture Build & Push to GHCR
# =============================================================================
# This workflow builds lychee Docker images for linux/amd64 and linux/arm64
# and pushes them to GitHub Container Registry (ghcr.io).
#
# Triggers:
#   - Push to main branch
#   - Tags matching v* (release tags)
#   - Manual workflow_dispatch
#
# Image: ghcr.io/md-mushfiqur123/lychee
# Tags:  latest, git-sha, version-tag
# =============================================================================

name: Docker Multi-Arch Build & Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: md-mushfiqur123
  IMAGE_NAME: lychee

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # -------------------------------------------------------------------
      # Step 1: Checkout the repository
      # -------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------------------
      # Step 2: Extract metadata (version, tags, labels)
      # -------------------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            # 'latest' tag — applied to the default branch (main)
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

            # Git short SHA — always applied for traceability
            type=sha,prefix=,format=short

            # Semantic version from git tags (e.g., v1.2.3)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # -------------------------------------------------------------------
      # Step 3: Set up QEMU for cross-platform emulation
      #         (required for building ARM64 on AMD64 runners)
      # -------------------------------------------------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # -------------------------------------------------------------------
      # Step 4: Set up Docker Buildx builder
      # -------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------------------------------------------------------------------
      # Step 5: Login to GitHub Container Registry
      #         Uses the automatic GITHUB_TOKEN for authentication
      # -------------------------------------------------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # Step 6: Build & Push multi-architecture Docker image
      #         Platforms: linux/amd64 (x86_64) + linux/arm64 (Apple M-series, AWS Graviton, etc.)
      # -------------------------------------------------------------------
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOFLAGS=-ldflags=-w -s
          # Use GitHub Actions cache for faster subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
