<svg xmlns="http://www.w3.org/2000/svg" width="170" height="20" role="img" aria-label="Powered by Lychee">
  <defs>
    <linearGradient id="ly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <!-- Left: "Powered by" -->
  <rect x="0" y="0" width="80" height="20" rx="3" fill="#555"/>
  <rect x="0" y="17" width="80" height="3" fill="#555"/>

  <!-- Right: "Lychee" -->
  <rect x="80" y="0" width="90" height="20" rx="0" fill="#059669"/>
  <rect x="80" y="17" width="90" height="3" fill="#059669"/>
  <rect x="80" y="0" width="3" height="20" rx="3" fill="#059669"/>

  <!-- Text -->
  <text x="40" y="14" text-anchor="middle" fill="#bbb" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" font-weight="500">Powered by</text>
  <text x="125" y="14" text-anchor="middle" fill="#fff" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11" font-weight="600">Lychee</text>
</svg>
